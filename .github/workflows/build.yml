name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game"
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Patch package name
        shell: bash
        run: |
          PACKAGE_NAME="${{ github.event.inputs.package_name }}"
          sed -i "s|moduleDescription = \"|moduleDescription = \"(${PACKAGE_NAME}) |g" module.gradle
          sed -i "s|com.game.packagename|${PACKAGE_NAME}|g" \
            module/src/main/cpp/game.h
      - name: Build Release
        run: ./gradlew :module:assembleRelease --no-daemon
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zygisk-il2cppdumper
          path: out/magisk_module_release/
          if-no-files-found: error
